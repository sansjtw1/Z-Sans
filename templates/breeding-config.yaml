# Z-Sans 资产繁殖引擎配置模板（完整参考版）
# 本模板覆盖 engine 支持的全部配置项，均含中文注释。
# 使用方法：复制此文件到项目根目录并改名为 breeding-config.yaml，
# 然后执行 `python main.py --init`（或直接运行 `python main.py` 自动加载）。
# 若没有此文件，程序将使用内置的默认配置（core/zsans_engine.py 中的 DEFAULT_CONFIG）。

# 繁殖策略：priority_based（优先级优先）、depth_first（深度优先）、breadth_first（广度优先）、time_based（时间顺序）
strategy: priority_based  # 采用基于优先级的遍历策略

# 插件配置（目录插件与单文件插件自动加载）
plugins:
  dir: null             # 插件目录路径，null 时使用项目根目录下的 plugins/
  disabled: []          # 需要禁用的插件名列表（用于解决同名插件冲突）

# 资产扫描范围配置
asset_scope:
  restrict_to_seed_domains: true    # 仅扫描种子域名范围内资产
  restrict_to_seed_ip_ranges: true  # 仅扫描种子IP段范围（与 DEFAULT_CONFIG 默认一致，可改为 false 不限制）
  include_subdomains: true          # 扫描包含所有子域名
  include_ip_ranges: true           # 同步扫描关联IP段

# 并发任务配置
concurrency:
  max_tasks: 20        # 全局最大并发任务数
  tools:               # 各工具独立并发限制
    subfinder: 2       # 子域名探测工具并发数
    naabu: 2          # 端口扫描工具并发数
    jsfinder: 2       # JS文件抓取工具并发数

max_depth: 4          # 资产最大挖掘层级深度

# 各类资产数量上限限制
resource_limits:
  max_domains: 2000    # 最大收集域名数量
  max_ips: 2000       # 最大收集IP数量
  max_urls: 5000      # 最大收集URL链接数量
  max_ports: 5000     # 最大识别端口总量
  max_js: 2000        # 最大抓取JS文件数量

# 各类资产扫描开关配置
asset_types:
  # 域名资产配置
  domain:
    enabled: true      # 域名探测
    depth_limit: 3     # 域名挖掘最大深度
    priority: 10       # 任务优先级（数值越高，优先执行）
    tools:             # 启用的探测工具列表
      subfinder: true      # 启用subfinder子域名扫描
      free_subfinder: false # 不使用免费版subfinder
      crtsh: true         # 启用证书透明度日志crt.sh查询
      dnsx: true          # 启用dnsx做DNS解析验证
      dns_brute: true     # 启用DNS暴力枚举子域名

  # IP资产配置
  ip:
    enabled: true      # IP资产探测
    depth_limit: 4     # IP挖掘最大深度
    priority: 8        # 任务优先级
    tools:
      naabu: true         # 启用naabu端口扫描
      reverse_dns: true   # IP反向DNS解析
      port_range: '1-1024,3306,3389,5432,5900,6379,7001,8000-8500,8888,9000-9100,9200,27017,11211'  # 内置端口扫描器扫描范围

  # URL链接资产配置
  url:
    enabled: true      # URL链接抓取
    depth_limit: 5     # URL挖掘最大深度
    priority: 10        # 任务优先级
    tools:
      jsfinder: true      # 启用JS文件提取
      link_extract: true  # 页面超链接提取
      fingerprint: false  # 启用站点指纹识别（依赖 external_tools.fingerprint.enabled 与 ehole）
    title_extraction:     # 网页标题抓取配置
      enabled: true           # 网页标题获取
      max_length: 50         # 标题最大截取长度
      show_in_report: true   # 报告中展示标题
      show_in_csv: true      # CSV导出文件包含标题字段

  # 端口资产配置
  port:
    enabled: true      # 端口识别
    depth_limit: 5     # 端口探测最大深度
    priority: 7        # 任务优先级
    tools:
      service_identify: true # 端口对应服务识别

  # JS文件资产配置
  js:
    enabled: true      # JS文件探测
    depth_limit: 4     # JS文件挖掘最大深度
    priority: 6        # 任务优先级
    tools:
      jsfinder: true      # JS文件探测工具

# 输出文件配置
output:
  dir: output          # 输出文件夹名称
  output_prefix: zsans # 输出文件名前缀（如 zsans_domains.json）
  graph_format: json   # 资产关系图存储格式
  asset_report: json   # 资产清单报告格式
  keep_eliminated_assets: true  # 保留已过滤剔除的资产数据
  formats:             # 启用的导出文件格式
    json: true         # JSON格式导出
    csv: true          # CSV表格导出
    graphml: true      # GraphML拓扑图文件导出
    html: true         # 交互式HTML报告
  auto_open: true      # 扫描完成自动打开HTML报告

# 第三方外部工具配置
external_tools:
  paths:               # 工具自定义路径配置，不填则自动读取环境变量
    subfinder: null    # subfinder程序路径，示例：/usr/bin/subfinder
    naabu: null        # naabu程序路径，示例：D:\naabu\naabu.exe
    ehole: null        # EHole站点指纹识别工具路径
    whatweb: null      # WhatWeb站点指纹识别工具路径
  fingerprint:       # 站点指纹识别配置
    enabled: false    # 站点指纹识别功能
    engine: auto      # 指纹识别引擎：auto（有哪个用哪个，默认）/ ehole / whatweb / both（两者都跑并合并结果）
  jsfinder_timeout: 30  # JSFinder 抓取每个域名时的超时时间（秒）

# 国际化多语言配置
language:
  default_language: en  # 默认语言，可选 zh_CN / en
  supported_languages:     # 支持的语言列表
    - zh_CN
    - en
  locale_dir: i18n         # 语言翻译文件存放目录

# 资产排除过滤规则
exclusions:
  domains:             # 需过滤的域名列表
  - example.com
  - test.local
  ips:                 # 需过滤的IP地址列表
  - 127.0.0.1
  - 0.0.0.0
  urls:                # 包含指定关键词则过滤URL
  - login
  - logout
  ports: []           # 需过滤的端口列表
  patterns:           # 正则匹配过滤规则
  - \.(css|jpg|jpeg|png|gif|svg|woff|woff2|ttf|eot)$

# 断点续扫配置（配合 --resume 使用）
checkpoint:
  enabled: true      # 是否启用断点续扫（默认开启，扫描期间定期保存进度）
  interval: 50       # 每处理多少资产保存一次断点
  file: null         # 断点文件路径，null 时使用 <output_dir>/checkpoint.json

# 变更监控配置（配合 --watch 使用）
monitoring:
  enabled: false        # 是否启用 --watch 变更监控
  interval: 3600        # 监控轮询间隔（秒）
  webhook_url: null     # 变更告警 Webhook 地址，POST JSON 通知

# HTTP网络请求全局配置
http:
  timeout: 10         # 请求超时时间，单位：秒
  retries: 3          # 请求失败重试次数
  user_agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/91.0.4472.124 Safari/537.36  # 请求UA标识
  verify_ssl: false   # SSL证书校验（兼容自签名证书站点）
  proxy: null         # 代理地址配置，不填则不使用代理
  follow_redirects: true  # 自动跟随页面重定向跳转
  redirect_as_new_asset: true  # 将重定向目标地址作为新资产收录
  max_redirects: 5    # 单条链接最大跟随重定向次数